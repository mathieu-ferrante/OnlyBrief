[project]
name = "onlybrief"
version = "0.1.0"
description = "Service de collecte et de rédaction des éditions OnlyBrief"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "tzdata>=2024.1",            # fuseaux horaires sous Windows
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
onlybrief = "onlybrief.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
